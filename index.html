<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staff Check-in Banner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Special+Elite&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#EEE7D7; --paper-d:#DCD2BC; --ink:#17181C; --denim:#2F4F7F; --denim-l:#7E9BC0; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;overflow:hidden;background:#E6DCC6 radial-gradient(rgba(122,101,56,.14) .6px,transparent .7px) 0 0/3px 3px;font-family:"Cormorant Garamond",Georgia,serif}
  .note{font:14px system-ui,sans-serif;background:#fff;padding:10px 14px;border-radius:8px;max-width:900px;line-height:1.5}

  /* ===== banner ===== */
  .banner{position:absolute;width:900px;aspect-ratio:900/340;overflow:hidden;background:var(--paper);transform-origin:0 0;
          }
  /* city collage, washed into the paper */
  .banner .city{position:absolute;inset:0;background:url(city.jpg) center 40%/cover;
          filter:grayscale(.35) contrast(1.05);opacity:.55;mix-blend-mode:multiply}
  /* paper grain over everything */
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .30  0 0 0 0 .22  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(60,45,20,.35)}

  /* denim strip on the left */
  .denim{position:absolute;left:0;top:0;bottom:0;width:250px;background:url(denim.jpg) center/cover;
         clip-path:polygon(0 0,100% 0,88% 18%,97% 40%,86% 63%,95% 82%,84% 100%,0 100%);
         box-shadow:inset -8px 0 18px rgba(0,0,0,.25)}
  .denim::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(23,24,28,.15),transparent)}

  /* title block (on denim) */
  .title{position:absolute;left:30px;top:34px;width:200px;color:#F4EFE3}
  .title .kicker{font-family:"Special Elite",monospace;font-size:11px;letter-spacing:3px;opacity:.9}
  .title h1{font-family:"Playfair Display",serif;font-weight:900;font-size:44px;line-height:.92;margin:10px 0 12px;
            text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .title .rule{height:1px;background:rgba(244,239,227,.6);margin:0 0 10px}
  .title p{margin:0;font-style:italic;font-size:17px;line-height:1.3}

  /* eye-man collage cut-out */
  .eye{position:absolute;left:300px;bottom:-6px;height:96%;aspect-ratio:736/920;
       background:url(eye-man.jpg) center/cover;
       -webkit-mask-image:radial-gradient(ellipse 46% 52% at 50% 52%,#000 72%,transparent 74%);
               mask-image:radial-gradient(ellipse 46% 52% at 50% 52%,#000 72%,transparent 74%);
       filter:sepia(.25) contrast(1.08);mix-blend-mode:multiply}

  /* stamp */
  .stamp{position:absolute;left:555px;top:44px;font-family:"Special Elite",monospace;color:var(--denim);
         border:2px solid var(--denim);padding:4px 8px 3px;letter-spacing:1.5px;font-size:10px;transform:rotate(-7deg);
         opacity:.85;box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px var(--denim)}

  /* ===== clock ===== */
  .clockwrap{position:absolute;left:536px;top:122px;width:178px;height:208px;transform:rotate(-4deg)}
  .clock{width:100%;height:100%;filter:drop-shadow(2px 3px 1.5px rgba(40,30,15,.35)) drop-shadow(0 0 .5px rgba(0,0,0,.2))}
  .tape{position:absolute;left:58px;top:-6px;width:64px;height:20px;transform:rotate(-8deg);
        background:rgba(238,226,196,.72);box-shadow:0 1px 2px rgba(0,0,0,.15);
        clip-path:polygon(3% 0,97% 4%,100% 50%,96% 100%,2% 96%,0 45%);mix-blend-mode:multiply}
  /* ===== calendar ===== */
  .cal{position:absolute;right:30px;top:46px;width:136px;transform:rotate(4deg);filter:drop-shadow(2px 3px 1.5px rgba(40,30,15,.35)) drop-shadow(0 0 .5px rgba(0,0,0,.2))}
  .cal .clip{position:absolute;left:36px;top:-9px;width:64px;height:20px;transform:rotate(5deg);z-index:3;background:rgba(238,226,196,.72);box-shadow:0 1px 2px rgba(0,0,0,.15);clip-path:polygon(3% 0,97% 4%,100% 50%,96% 100%,2% 96%,0 45%);mix-blend-mode:multiply}
  .cal .sheet{background:#F3ECDA;border:5px solid #F6F0E2;outline:1px solid rgba(120,100,60,.18);position:relative;overflow:hidden;background-image:radial-gradient(rgba(122,101,56,.16) .5px,transparent .6px);background-size:3px 3px}
  .cal .sheet::before{content:"";position:absolute;inset:0;opacity:.6;mix-blend-mode:multiply;background-image:inherit}
  .cal .head{background:#2B4A78;color:#F3ECDA;text-align:center;font-family:"Special Elite",monospace;letter-spacing:4px;font-size:12px;padding:7px 0 5px;border-bottom:2px solid #F3ECDA;box-shadow:0 2px 0 #2B4A78}
  .cal .day{font-family:"Playfair Display",serif;font-weight:900;font-size:76px;text-align:center;line-height:1;margin:8px 0 2px;color:#2B4A78}
  .cal .wd{text-align:center;font-style:italic;font-size:17px;padding:4px 0 9px;border-top:1px solid rgba(43,74,120,.45);margin:0 14px;color:#2B4A78}
  .cal .perf{height:7px;background:radial-gradient(circle at 4px 3.5px,#F6F0E2 1.8px,transparent 2.2px) 0 0/9px 7px,#2B4A78;opacity:.85}

  .shake{animation:shake .7s ease-in-out}
  @keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg)}30%{transform:rotate(8deg)}45%{transform:rotate(-6deg)}60%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}}
  .label{font:13px system-ui,sans-serif;color:#d9d9d9;width:900px;max-width:100%;margin:-12px 0 0}
  .palette{display:flex;gap:8px;width:900px;max-width:100%}
  .palette div{flex:1;height:44px;border-radius:4px;font:12px system-ui;display:flex;align-items:end;padding:5px;color:#fff}
</style>
</head>
<body>

<div class="banner">
  <div class="city"></div>
  <div class="eye"></div>
  <div class="denim"></div>
  <div class="title">
    <div class="kicker">EST. 2026 · EXTRA!</div>
    <h1>Garage<br>Gazette</h1>
    <div class="rule"></div>
    <p>Every task counts.<br>Every press pays.</p>
  </div>
  <div class="stamp">VOL. 1 · NO. 001</div>

  <!-- paper cut-out vintage clock (printed look, taped on) -->
  <div class="clockwrap">
  <svg class="clock" id="clock" viewBox="0 0 170 200" onclick="this.classList.remove('shake');void this.offsetWidth;this.classList.add('shake')" style="cursor:pointer">
    <defs>
      <!-- white paper margin around the cut-out -->
      <filter id="cut" x="-10%" y="-10%" width="120%" height="120%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="4.5" result="d"/>
        <feFlood flood-color="#F6F0E2"/><feComposite in2="d" operator="in" result="paper"/>
        <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" result="n"/>
        <feColorMatrix in="n" values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .25  0 0 0 .25 0" result="g"/>
        <feComposite in="g" in2="d" operator="in" result="grain"/>
        <feMerge><feMergeNode in="paper"/><feMergeNode in="grain"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <!-- slightly rough printed ink -->
      <filter id="ink"><feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="1" result="t"/>
        <feDisplacementMap in="SourceGraphic" in2="t" scale="1.1"/></filter>
      <pattern id="half" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="1.3" cy="1.3" r=".75" fill="#2B4A78"/></pattern>
      <pattern id="halfL" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="1.3" cy="1.3" r=".45" fill="#2B4A78"/></pattern>
      <pattern id="age" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".5" fill="#7a6538" opacity=".18"/></pattern>
    </defs>
    <g filter="url(#cut)"><g filter="url(#ink)">
      <!-- legs -->
      <path d="M46 166 L34 192 L42 192 L54 170 Z" fill="#2B4A78"/>
      <path d="M124 166 L136 192 L128 192 L116 170 Z" fill="#2B4A78"/>
      <!-- bells: flat ink with halftone shading -->
      <g transform="rotate(-26 40 42)">
        <path d="M13 48 Q14 20 40 18 Q66 20 67 48 Z" fill="#2B4A78"/>
        <path d="M20 44 Q22 26 38 23" fill="none" stroke="#EFE6D0" stroke-width="2.4" stroke-linecap="round" opacity=".85"/>
        <rect x="37" y="11" width="6" height="8" fill="#2B4A78"/>
      </g>
      <g transform="rotate(26 130 42)">
        <path d="M103 48 Q104 20 130 18 Q156 20 157 48 Z" fill="#2B4A78"/>
        <path d="M110 44 Q112 26 128 23" fill="none" stroke="#EFE6D0" stroke-width="2.4" stroke-linecap="round" opacity=".85"/>
        <rect x="127" y="11" width="6" height="8" fill="#2B4A78"/>
      </g>
      <!-- hammer -->
      <path d="M83 26 L87 26 L87 44 L83 44 Z" fill="#2B4A78"/><circle cx="85" cy="23" r="4.5" fill="#2B4A78"/>
      <!-- case: solid ink ring + halftone shading -->
      <circle cx="85" cy="112" r="70" fill="#2B4A78"/>
      <circle cx="85" cy="112" r="64" fill="#EFE6D0"/>
      <circle cx="85" cy="112" r="64" fill="url(#halfL)" opacity=".35"/>
      <circle cx="85" cy="112" r="60" fill="#F3ECDA"/>
      <circle cx="85" cy="112" r="60" fill="url(#age)"/>
      <!-- engraved rings -->
      <circle cx="85" cy="112" r="57" fill="none" stroke="#2B4A78" stroke-width="1.4"/>
      <circle cx="85" cy="112" r="55" fill="none" stroke="#2B4A78" stroke-width=".4"/>
      <circle cx="85" cy="112" r="47.5" fill="none" stroke="#2B4A78" stroke-width=".4"/>
      <circle cx="85" cy="112" r="22" fill="none" stroke="#2B4A78" stroke-width=".35" stroke-dasharray="1 1.6"/>
      <g id="ticks"></g>
      <g id="nums" font-family="Playfair Display, serif" font-weight="700" font-size="9.5" fill="#2B4A78" text-anchor="middle"></g>
      <text x="85" y="94" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-size="7.5" fill="#2B4A78">Garage Gazette</text>
      <text x="85" y="138" text-anchor="middle" font-family="Special Elite, monospace" font-size="4.6" letter-spacing="1.6" fill="#2F4F7F">EST · MMXXVI</text>
      <!-- Breguet-style hands -->
      <g id="h"><path d="M84.2 116 L84.2 98 L85.8 98 L85.8 116 Z" fill="#2B4A78"/><circle cx="85" cy="93" r="4.2" fill="none" stroke="#2B4A78" stroke-width="1.6"/><path d="M85 88.8 L83.4 84 L85 80 L86.6 84 Z" fill="#2B4A78"/></g>
      <g id="m"><path d="M84.4 118 L84.4 82 L85.6 82 L85.6 118 Z" fill="#2B4A78"/><circle cx="85" cy="78" r="3.4" fill="none" stroke="#2B4A78" stroke-width="1.3"/><path d="M85 74.6 L83.8 70 L85 64 L86.2 70 Z" fill="#2B4A78"/></g>
      <g id="s"><line x1="85" y1="126" x2="85" y2="62" stroke="#17181C" stroke-width=".8"/><circle cx="85" cy="122" r="2" fill="#17181C"/></g>
      <circle cx="85" cy="112" r="2.6" fill="#2B4A78"/><circle cx="85" cy="112" r="1" fill="#EFE6D0"/>
    </g></g>
  </svg>
  <div class="tape"></div>
  </div>

  <!-- tear-off calendar -->
  <div class="cal">
    <div class="clip"></div>
    <div class="sheet">
      <div class="head" id="mon">NOV · 2026</div>
      <div class="day" id="day">7</div>
      <div class="wd" id="wd">Saturday</div>
      <div class="perf"></div>
    </div>
  </div>

  <div class="grain"></div><div class="vignette"></div>
</div>

<script>
  const NS='http://www.w3.org/2000/svg',cx=85,cy=112;
  const t=document.getElementById('ticks'),n=document.getElementById('nums');
  for(let i=0;i<60;i++){const a=i*6*Math.PI/180,big=i%5===0,r1=55,r2=big?50.5:52.5;
    const l=document.createElementNS(NS,'line');
    l.setAttribute('x1',cx+r1*Math.sin(a));l.setAttribute('y1',cy-r1*Math.cos(a));
    l.setAttribute('x2',cx+r2*Math.sin(a));l.setAttribute('y2',cy-r2*Math.cos(a));
    l.setAttribute('stroke','#2B4A78');l.setAttribute('stroke-width',big?1.4:.5);t.appendChild(l);}
  const RN=['XII','I','II','III','IIII','V','VI','VII','VIII','IX','X','XI'];
  for(let i=0;i<12;i++){const a=i*30*Math.PI/180,r=40.5;
    const tx=document.createElementNS(NS,'text');const x=cx+r*Math.sin(a),y=cy-r*Math.cos(a);
    tx.setAttribute('x',x);tx.setAttribute('y',y+3.2);
    tx.setAttribute('transform',`rotate(${i*30} ${x} ${y})`);tx.textContent=RN[i];n.appendChild(tx);}
  function tick(){const d=new Date(),s=d.getSeconds()+d.getMilliseconds()/1000,m=d.getMinutes()+s/60,h=(d.getHours()%12)+m/60;
    document.getElementById('h').setAttribute('transform',`rotate(${h*30} ${cx} ${cy})`);
    document.getElementById('m').setAttribute('transform',`rotate(${m*6} ${cx} ${cy})`);
    document.getElementById('s').setAttribute('transform',`rotate(${Math.floor(s)*6} ${cx} ${cy})`);
    document.getElementById('day').textContent=d.getDate();
    document.getElementById('mon').textContent=d.toLocaleString('en',{month:'short'}).toUpperCase()+' · '+d.getFullYear();
    document.getElementById('wd').textContent=d.toLocaleString('en',{weekday:'long'});}
  tick();setInterval(tick,250);
  function fit(){const b=document.querySelector(".banner"),W=innerWidth,H=innerHeight||340,k=Math.min(W/900,H/340);
    b.style.transform="scale("+k+")";b.style.left=((W-900*k)/2)+"px";b.style.top=((H-340*k)/2)+"px";}
  fit();addEventListener("resize",fit);
</script>
</body>
</html>
